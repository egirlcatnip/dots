# /etc/logid.cfg - libconfig file for logiops
# emi's config
# key codes from linux's input-event-codes.h
# https://github.com/torvalds/linux/blob/master/include/uapi/linux/input-event-codes.h

#

devices: (
  {
    name: "MX Master 3S";
    dpi: 1000;

    # Scroll-wheel tactile-feedback
    smartshift: {
      # Simulate torque always on
      on: true;
      threshold: 255;
      default_threshold: 255;
      torque: 255;
    };

    thumbwheel: {
      # Enable logiops' handling of thumbwheel
      divert: true;
      invert: false;

      # Scrolling left/down
      left: {
        threshold: 3;
        interval:  3;
        direction: "Left";
        mode: "OnInterval";
        action = {
              type: "Keypress";
              keys: ["KEY_VOLUMEDOWN"];
        };
      },

      # Scrolling right/up
      right: {
        threshold: 3;
        interval:  3;
        direction: "Right";
        mode: "OnInterval";
        action: {
            type: "Keypress";
            keys: ["KEY_VOLUMEUP"];
        };
      };
    };

    buttons: (
      { #Thumb button
        cid: 0xc3,
        action: {
          # Middle-click with thumb button
          type: "Keypress";
          keys: ["BTN_MIDDLE"];
        };
      },

      { #DPI button
        cid: 0xc4,
        action: {
          type: "Keypress";
          # Screenshot with META+SHIFT+S
          keys: ["KEY_LEFTMETA", "KEY_LEFTSHIFT", "KEY_S"];
        };
      },
    );

  }
);
